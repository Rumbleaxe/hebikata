id: var_hack_001
metadata:
  chapter: 1
  concept: variables
  subconcept: strings
  difficulty: beginner
  theme: hacking
  prerequisites: [var_rpg_001]
  tags: [variables, strings]
content:
  prompt: |
    💀 Breach the mainframe! Set decrypt_key to "skRM9x".
  initial_code: |
    decrypt_key = "guest"  # Wrong credentials
validation:
  tests: |
    def test_key():
        assert decrypt_key == "skRM9x", "Access denied"
hints:
  - level: basic
    text: "Strings use quotes — what should decrypt_key contain?"
  - level: detailed
    text: "decrypt_key = 'skRM9x' (quotes for strings)"
  - level: solution
    text: 'Replace "guest" with "skRM9x": decrypt_key = "skRM9x"'
pep_tip: "String literals use single or double quotes — pick one and be consistent"
boss: false
